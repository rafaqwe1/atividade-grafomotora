<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação: Desenvolvimento Motor Infantil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
        }

        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animação Vermelha (Venda) */
        .pulse-btn {
            animation: pulse-heartbeat 2s infinite;
        }

        @keyframes pulse-heartbeat {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6);
            }

            50% {
                transform: scale(1.03);
                box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        /* Animação Verde (Início) */
        .pulse-green {
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
            }

            50% {
                transform: scale(1.04);
                box-shadow: 0 0 0 15px rgba(34, 197, 94, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .option-btn:active {
            transform: scale(0.98);
            background-color: #EFF6FF;
            border-color: #3B82F6;
        }
    </style>
    <script>
        !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
                n.callMethod ?
                    n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            }
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'
            n.queue = []; t = b.createElement(e); t.async = !0
            t.src = v; s = b.getElementsByTagName(e)[0]
            s.parentNode.insertBefore(t, s)
        }(window, document, 'script',
            'https://connect.facebook.net/en_US/fbevents.js')
        fbq('init', '880159754866026')
        fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=880159754866026&ev=PageView&noscript=1" /></noscript>
</head>

<body class="text-slate-800 flex flex-col min-h-screen">

    <header class="bg-white p-3 shadow-sm border-b border-slate-200 flex justify-center items-center">
        <svg class="w-5 h-5 text-indigo-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
            </path>
        </svg>
        <h1 class="text-xs sm:text-sm font-bold text-slate-600 tracking-wide uppercase">Avaliação Segura • 3 a 6 Anos
        </h1>
    </header>

    <main class="flex-grow flex items-start justify-center p-4 pt-8 sm:items-center">
        <div id="quiz-container"
            class="bg-white max-w-lg w-full rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] p-5 sm:p-8 border border-slate-100 fade-in relative overflow-hidden">

            <div id="progress-bar-container" class="w-full bg-slate-100 rounded-full h-2 mb-6 hidden overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-500 ease-out"
                    style="width: 0%"></div>
            </div>

            <div id="intro-badge" class="flex justify-center mb-4">
                <span
                    class="bg-indigo-100 text-indigo-800 text-xs font-black px-3 py-1 rounded-full uppercase tracking-wide border border-indigo-200 shadow-sm">
                    ⏱️ Leva apenas 1 minuto
                </span>
            </div>

            <h2 id="question-title"
                class="text-2xl sm:text-3xl font-black text-slate-800 mb-3 text-center leading-tight">
                Seu filho está com <span class="text-red-600 underline decoration-red-300">Atraso Motor</span> por causa
                do celular?
            </h2>

            <p id="intro-subtitle" class="text-slate-500 text-center mb-8 text-sm font-medium leading-relaxed">
                Responda 4 perguntas simples e descubra o risco real de bloqueio na alfabetização.
            </p>

            <div id="options-container" class="space-y-3">
                <button onclick="startQuiz()"
                    class="pulse-green w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-black py-5 rounded-xl shadow-lg transition-all text-xl border-b-4 border-green-700 active:border-b-0 active:translate-y-1 flex justify-center items-center">
                    👉 COMEÇAR O TESTE AGORA
                </button>
            </div>

            <p id="disclaimer" class="text-[11px] text-slate-400 text-center mt-6 font-medium uppercase tracking-wider">
                🔒 Respostas 100% Confidenciais</p>
        </div>
    </main>

    <script>
        const questions = [
            { question: "1. Quanto tempo por dia seu filho passa no celular, tablet ou TV?", options: ["Menos de 1 hora (Consigo controlar)", "Entre 1 e 2 horas (Para ele comer/ficar quieto)", "Mais de 2 horas (Ele está dependente)", "Ele chora e faz birra se eu tentar tirar"] },
            { question: "2. Como ele segura o lápis de cor ou giz de cera?", options: ["Segura firme e desenha sem problemas", "Segura com a mão toda fechada (como bastão)", "O traço sai fraco, trêmulo ou a mão cansa", "Tem preguiça, foge ou chora ao ver o lápis"] },
            { question: "3. Pensando na alfabetização, qual é o seu maior medo?", options: ["Que ele sofra por não acompanhar a turma", "Que a professora diga que ele tem atraso", "Que ele crie um bloqueio e odeie estudar", "Nenhum, acho que ele vai se sair bem"] },
            { question: "4. É possível reverter esse bloqueio em casa. Você tem APENAS 15 MINUTOS por dia para isso?", options: ["SIM! Farei o que for preciso pelo meu filho.", "Não tenho 15 minutos (Deixar como está)."] }
        ]

        let currentQuestionIndex = 0
        const titleEl = document.getElementById('question-title')
        const optionsContainer = document.getElementById('options-container')
        const progressContainer = document.getElementById('progress-bar-container')
        const progressBar = document.getElementById('progress-bar')
        const disclaimer = document.getElementById('disclaimer')
        const introBadge = document.getElementById('intro-badge')
        const introSubtitle = document.getElementById('intro-subtitle')

        function startQuiz() {
            disclaimer.style.display = 'none'
            if (introBadge) introBadge.style.display = 'none'
            if (introSubtitle) introSubtitle.style.display = 'none'
            progressContainer.classList.remove('hidden')
            fbq('trackCustom', 'StartedQuiz')
            showQuestion()
        }

        function showQuestion() {
            const currentQ = questions[currentQuestionIndex]
            titleEl.innerText = currentQ.question
            titleEl.classList.remove('fade-in')
            void titleEl.offsetWidth
            titleEl.classList.add('fade-in')

            optionsContainer.innerHTML = ''
            const progress = ((currentQuestionIndex) / questions.length) * 100
            progressBar.style.width = `${progress}%`

            currentQ.options.forEach(option => {
                const btn = document.createElement('button')
                btn.innerText = option
                btn.className = "option-btn w-full bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl text-left transition-all duration-200 fade-in shadow-sm hover:border-indigo-300 hover:bg-slate-50 text-[15px] leading-snug"
                btn.onclick = () => {
                    btn.classList.add('bg-indigo-50', 'border-indigo-500')
                    setTimeout(handleAnswer, 300)
                }
                optionsContainer.appendChild(btn)
            })
        }

        function handleAnswer() {
            currentQuestionIndex++
            if (currentQuestionIndex < questions.length) {
                showQuestion()
            } else {
                showAnalyzingScreen()
            }
        }

        function showAnalyzingScreen() {
            progressBar.style.width = '100%'
            titleEl.innerText = "Analisando respostas..."
            optionsContainer.innerHTML = `
                <div class="flex justify-center my-8 fade-in">
                    <div class="animate-spin rounded-full h-14 w-14 border-t-4 border-b-4 border-indigo-600"></div>
                </div>
                <p class="text-center text-slate-500 font-semibold fade-in">Cruzando dados de desenvolvimento...</p>
            `
            setTimeout(showResultScreen, 3500)
        }

        function showResultScreen() {
            progressContainer.style.display = 'none'
            titleEl.innerHTML = `<span class="text-red-600 font-black">ALERTA:</span> Atraso Motor Silencioso detectado.`

            fbq('trackCustom', 'FinishedQuiz')

            optionsContainer.innerHTML = `
                <div class="text-slate-700 text-sm mb-4 fade-in leading-relaxed">
                    <p>A fraqueza nas mãos do seu filho é reflexo do uso excessivo de telas. Se nada for feito agora, a alfabetização será frustrante.</p>
                    
                    <div class="bg-indigo-50 border-l-4 border-indigo-600 p-3 rounded-r-lg text-indigo-900 shadow-sm mt-3">
                        <strong class="block text-indigo-800">A SOLUÇÃO:</strong> Destrave a coordenação dele com 15 min/dia usando o <strong>Kit Desmame + Atividades</strong>.
                    </div>
                </div>
                
                <div class="text-center mb-3 fade-in flex flex-col items-center">
                    <p class="text-red-600 font-bold text-xs mb-1">⚠️ Desconto de avaliação liberado:</p>
                    <span class="text-slate-400 line-through text-xs font-bold">De R$ 147,00</span>
                    <span class="text-green-600 font-black text-xl tracking-tight">Por apenas R$ 67,90</span>
                </div>
                
                <a href="https://pay.kiwify.com.br/GtEoYz9" class="pulse-btn block w-full bg-red-600 text-white text-center font-black text-lg py-4 px-3 rounded-xl shadow-lg border-b-4 border-red-800 fade-in decoration-none tracking-tight hover:bg-red-700">
                    👉 ACESSAR O KIT COM DESCONTO
                </a>
            `
        }
    </script>
</body>

</html>

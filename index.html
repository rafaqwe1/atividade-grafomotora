<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Sono Infantil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
        }

        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animação Vermelha (Venda) */
        .pulse-btn {
            animation: pulse-heartbeat 2s infinite;
        }

        @keyframes pulse-heartbeat {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            50% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Animação Verde (Início) */
        .pulse-green {
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
            50% { transform: scale(1.04); box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .option-btn:active {
            transform: scale(0.98);
            background-color: #EFF6FF;
            border-color: #3B82F6;
        }
    </style>
    <script>
        !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
                n.callMethod ?
                    n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            }
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'
            n.queue = []; t = b.createElement(e); t.async = !0
            t.src = v; s = b.getElementsByTagName(e)[0]
            s.parentNode.insertBefore(t, s)
        }(window, document, 'script',
            'https://connect.facebook.net/en_US/fbevents.js')
        fbq('init', '880159754866026')
        fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=880159754866026&ev=PageView&noscript=1" /></noscript>
</head>

<body class="text-slate-800 flex flex-col min-h-screen">

    <header class="bg-white p-3 shadow-sm border-b border-slate-200 flex justify-center items-center">
        <svg class="w-5 h-5 text-indigo-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
            </path>
        </svg>
        <h1 class="text-xs sm:text-sm font-bold text-slate-600 tracking-wide uppercase">Avaliação Segura • Sono Infantil
        </h1>
    </header>

    <main class="flex-grow flex items-start justify-center p-4 pt-8 sm:items-center">
        <div id="quiz-container"
            class="bg-white max-w-lg w-full rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] p-5 sm:p-8 border border-slate-100 fade-in relative overflow-hidden">

            <div id="progress-bar-container" class="w-full bg-slate-100 rounded-full h-2 mb-6 hidden overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-500 ease-out"
                    style="width: 0%"></div>
            </div>

            <div id="intro-badge" class="flex justify-center mb-4">
                <span
                    class="bg-indigo-100 text-indigo-800 text-xs font-black px-3 py-1 rounded-full uppercase tracking-wide border border-indigo-200 shadow-sm">
                    ⏱️ Leva apenas 1 minuto
                </span>
            </div>

            <h2 id="question-title"
                class="text-2xl sm:text-3xl font-black text-slate-800 mb-3 text-center leading-tight">
                Seu bebê acorda de madrugada por causa de <span class="text-red-600 underline decoration-red-300">Associação de Sono</span>?
            </h2>

            <p id="intro-subtitle" class="text-slate-500 text-center mb-8 text-sm font-medium leading-relaxed">
                Responda 4 perguntas simples e descubra o grau de dependência e como fazer ele dormir a noite toda.
            </p>

            <div id="options-container" class="space-y-3">
                <button onclick="startQuiz()"
                    class="pulse-green w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-black py-5 rounded-xl shadow-lg transition-all text-xl border-b-4 border-green-700 active:border-b-0 active:translate-y-1 flex justify-center items-center">
                    👉 COMEÇAR O TESTE AGORA
                </button>
            </div>

            <p id="disclaimer" class="text-[11px] text-slate-400 text-center mt-6 font-medium uppercase tracking-wider">
                🔒 Respostas 100% Confidenciais</p>
        </div>
    </main>

    <script>
        const questions = [
            { question: "1. Como o seu bebê costuma pegar no sono hoje?", options: ["Só dorme no peito (mamando)", "Precisa de colo ou ficar embalando", "Chupeta ou deitando na minha cama", "Dorme sozinho no berço (Raro)"] },
            { question: "2. Quantas vezes ele costuma acordar durante a madrugada?", options: ["Acorda 1 vez (Fácil de voltar a dormir)", "Acorda 2 a 3 vezes", "Acorda 4 vezes ou mais (Mãe exausta)", "Fica horas acordado querendo brincar/chorando"] },
            { question: "3. Qual é a pior consequência da privação de sono para você hoje?", options: ["O cansaço extremo e a falta de energia de dia", "O medo dele não estar se desenvolvendo bem", "O impacto negativo no meu casamento/relação", "A irritação constante por não dormir direito"] },
            { question: "4. É comprovado que é possível quebrar a Associação de Sono. Você estaria disposta a aplicar um método simples antes de dormir para resolver isso?", options: ["SIM! Eu preciso voltar a dormir urgente.", "Não tenho tempo agora (Deixar como está)."] }
        ]

        let currentQuestionIndex = 0
        const titleEl = document.getElementById('question-title')
        const optionsContainer = document.getElementById('options-container')
        const progressContainer = document.getElementById('progress-bar-container')
        const progressBar = document.getElementById('progress-bar')
        const disclaimer = document.getElementById('disclaimer')
        const introBadge = document.getElementById('intro-badge')
        const introSubtitle = document.getElementById('intro-subtitle')

        function startQuiz() {
            disclaimer.style.display = 'none'
            if (introBadge) introBadge.style.display = 'none'
            if (introSubtitle) introSubtitle.style.display = 'none'
            progressContainer.classList.remove('hidden')
            fbq('trackCustom', 'StartedQuiz')
            showQuestion()
        }

        function showQuestion() {
            const currentQ = questions[currentQuestionIndex]
            titleEl.innerText = currentQ.question
            titleEl.classList.remove('fade-in')
            void titleEl.offsetWidth
            titleEl.classList.add('fade-in')

            optionsContainer.innerHTML = ''
            const progress = ((currentQuestionIndex) / questions.length) * 100
            progressBar.style.width = `${progress}%`

            currentQ.options.forEach(option => {
                const btn = document.createElement('button')
                btn.innerText = option
                btn.className = "option-btn w-full bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl text-left transition-all duration-200 fade-in shadow-sm hover:border-indigo-300 hover:bg-slate-50 text-[15px] leading-snug"
                btn.onclick = () => {
                    btn.classList.add('bg-indigo-50', 'border-indigo-500')
                    setTimeout(handleAnswer, 300)
                }
                optionsContainer.appendChild(btn)
            })
        }

        function handleAnswer() {
            currentQuestionIndex++
            if (currentQuestionIndex < questions.length) {
                showQuestion()
            } else {
                showAnalyzingScreen()
            }
        }

        function showAnalyzingScreen() {
            progressBar.style.width = '100%'
            titleEl.innerText = "Analisando respostas..."
            optionsContainer.innerHTML = `
                <div class="flex justify-center my-8 fade-in">
                    <div class="animate-spin rounded-full h-14 w-14 border-t-4 border-b-4 border-indigo-600"></div>
                </div>
                <p class="text-center text-slate-500 font-semibold fade-in">Cruzando dados com padrões de sono infantil...</p>
            `
            setTimeout(showResultScreen, 3500)
        }

        function showResultScreen() {
            progressContainer.style.display = 'none'
            titleEl.innerHTML = `<span class="text-red-600 font-black">ALERTA:</span> Associação de Sono detectada.`

            fbq('trackCustom', 'FinishedQuiz')

            // AQUI ESTÁ A MÁGICA DA NOVA COPY!
            optionsContainer.innerHTML = `
                <div class="text-slate-700 text-sm mb-4 fade-in leading-relaxed">
                    <p>O seu bebê não sabe emendar os ciclos de sono sozinho e criou uma forte dependência do peito/colo. Se isso não for corrigido agora, os despertares noturnos vão se tornar cada vez mais frequentes, esgotando a sua saúde física e mental.</p>
                    
                    <div class="bg-indigo-50 border-l-4 border-indigo-600 p-4 rounded-r-lg text-indigo-900 shadow-sm mt-4">
                        <strong class="block text-indigo-800 mb-1 text-[15px]">O SEU PLANO DE AÇÃO:</strong> 
                        Com base nas suas respostas, o método ideal para o seu bebê é o <strong>Método Soninho Sem Choro</strong>. Nós preparamos um Guia Passo a Passo para você aplicar hoje à noite e ensinar seu bebê a dormir no berço, sem deixá-lo chorar.
                    </div>
                </div>
                
                <div class="text-center mb-4 fade-in flex flex-col items-center bg-red-50 p-3 rounded-lg border border-red-100">
                    <p class="text-red-700 font-bold text-[11px] uppercase tracking-wide mb-1">⚠️ Atenção: Este plano com desconto expira assim que você fechar esta página.</p>
                    <div class="mt-1 flex items-center justify-center">
                        <span class="text-slate-400 line-through text-xs font-bold mr-2">De R$ 97,00</span>
                        <span class="text-green-600 font-black text-xl tracking-tight">Por apenas R$ 37,00</span>
                    </div>
                </div>
                
                <a href="https://pay.kiwify.com.br/GtEoYz9" class="pulse-btn block w-full bg-red-600 text-white text-center font-black text-[16px] py-4 px-2 rounded-xl shadow-lg border-b-4 border-red-800 fade-in decoration-none tracking-tight hover:bg-red-700">
                    👉 LIBERAR MEU PLANO AGORA (R$ 37,00)
                </a>

                <div class="mt-6 pt-5 border-t border-slate-200 fade-in">
                    <h3 class="text-center text-slate-400 font-bold text-[10px] uppercase mb-3 tracking-wider">Mães que já aplicaram:</h3>
                    
                    <div class="space-y-3">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-sm shadow-sm text-left">
                            <div class="flex items-center mb-1">
                                <span class="text-yellow-400 text-xs">⭐⭐⭐⭐⭐</span>
                                <span class="ml-2 font-bold text-slate-700 text-[11px] uppercase">Camila R. (Mãe do Léo)</span>
                            </div>
                            <p class="text-slate-600 text-xs italic">"Pela primeira vez em 8 meses meu bebê dormiu 5 horas seguidas! Eu achava que era impossível tirar o peito de madrugada, mas o passo a passo funcionou na segunda noite. 🙏"</p>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-sm shadow-sm text-left">
                            <div class="flex items-center mb-1">
                                <span class="text-yellow-400 text-xs">⭐⭐⭐⭐⭐</span>
                                <span class="ml-2 font-bold text-slate-700 text-[11px] uppercase">Juliana M.</span>
                            </div>
                            <p class="text-slate-600 text-xs italic">"Eu já não aguentava mais chorar de cansaço. Esse material salvou minha sanidade e o meu casamento. Vale cada centavo!"</p>
                        </div>
                    </div>
                </div>
            `
        }
    </script>
</body>

</html>
